networks:
  red_oficinas:
    driver: ipvlan
    driver_opts:
      parent: enp0s8
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: 10.0.3.16/29
          gateway: 10.0.3.17
        - subnet: 10.0.3.24/29
          gateway: 10.0.3.25
        - subnet: 10.0.3.32/30
          gateway: 10.0.3.33
        - subnet: 10.0.3.128/25
          gateway: 10.0.3.129

  red_informatica:
    driver: ipvlan
    driver_opts:
      parent: enp0s9
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: 10.0.3.36/30
          gateway: 10.0.3.37

  red_servidor:
    driver: ipvlan
    driver_opts:
      parent: enp0s10
      ipvlan_mode: l2
    ipam:
      config:
        - subnet: 10.0.3.48/28
          gateway: 10.0.3.49

services:
  # --- 5 ADMINISTRACIÓN ---
  admin1:
    image: alpine
    container_name: admin1
    command: sh -c "apk add --no-cache bind-tools postgresql-client && sleep infinity"
    healthcheck:
      test: ["CMD", "pgrep", "sleep"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    dns: [10.0.3.60]
    networks:
      red_oficinas:
        ipv4_address: 10.0.3.18

  admin2:
    image: alpine
